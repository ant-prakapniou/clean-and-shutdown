name: Build and Test

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 11 (preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Show .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Publish single-file exe
        run: |
          dotnet publish src/CleanAndShutdown.Cli `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -o publish

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanAndShutdown-win-x64
          path: |
            publish/CleanAndShutdown.exe
            publish/appsettings.json
          if-no-files-found: error

      - name: Package release asset
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $dir = "publish\CleanAndShutdown-$version-win-x64"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item publish\CleanAndShutdown.exe $dir
          Copy-Item src\CleanAndShutdown.Cli\appsettings.json $dir
          Compress-Archive -Path "$dir\*" -DestinationPath "publish\CleanAndShutdown-$version-win-x64.zip"

      - name: Create release and upload asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/CleanAndShutdown-*-win-x64.zip