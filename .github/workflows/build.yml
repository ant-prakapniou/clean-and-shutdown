name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 11 (preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Show .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

        
      - name: Publish single-file exe
        run: |
          dotnet publish src/CleanAndShutdown.Cli `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanAndShutdown-win-x64
          path: publish/CleanAndShutdown.Cli.exe
          if-no-files-found: error